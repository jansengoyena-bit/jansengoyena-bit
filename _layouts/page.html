<!DOCTYPE html>
<html lang="en">
<head>
    {% include head.html %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body class="text-[#011F3F] selection:bg-[#C5A059] selection:text-white overflow-x-hidden bg-[#FDFBF7]">
{% include header.html %}

<main>
    {{ content }}
</main>

{% include footer.html %}
{% include scripts.html %}
</body>

<script>
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('nav a');

    navLinks.forEach(link => {
        if (link.getAttribute('href') === currentPath) {
            link.classList.add('text-[#C5A059]', 'font-black'); // Added font-black for visibility
            link.classList.remove('hover:text-[#C5A059]');
        } else {
            link.classList.add('text-[#011F3F]', 'font-bold'); // Added font-bold for legibility
        }
    });
</script>

<style>
    /* 1. Only Target Main Paragraphs */
    /* This avoids affecting the Nav Bar, Logo, and Footer */
    main p {
        font-size: 19px !important;
        line-height: 1.8 !important;
        /* We do NOT set color or font-weight here */
    }

    /* 2. Scale Headings slightly for balance */
    main h1 { font-size: 3rem !important; }
    main h2 { font-size: 2.25rem !important; }
    main h3 { font-size: 1.5rem !important; }

    /* 3. Protect Small Elements */
    /* Ensures labels and tracking-widest text stay at their original design size */
    .tracking-widest,
    .label-meta,
    nav a {
        font-size: 11px !important;
        line-height: normal !important;
    }

    /* 4. Form Inputs */
    /* Only increase size for usability, no color change */
    input, select, textarea {
        font-size: 18px !important;
    }

    /* 5. Animation Distance Reset */
    /* Ensuring your original 50px/30px animations remain untouched */
    .reveal-left { transform: translateX(-50px); }
    .reveal-right { transform: translateX(50px); }
    .reveal-up { transform: translateY(30px); }
</style>
</html>
